<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Material Cost Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Inter, Arial, sans-serif;
  background:#edf2f7;
  min-height:100vh;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#1f2937;
}

.app{
  width:100%;
  max-width:1000px;
  background:#ffffff;
  border-radius:28px;
  overflow:hidden;
  box-shadow:
  0 15px 35px rgba(0,0,0,0.08),
  0 5px 15px rgba(0,0,0,0.04);
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  padding:35px;
  color:white;
}

.header h1{
  font-size:34px;
  margin-bottom:10px;
}

.header p{
  opacity:0.85;
  line-height:1.6;
  font-size:15px;
}

/* BODY */

.content{
  padding:35px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
}

.input-box{
  display:flex;
  flex-direction:column;
}

.full{
  grid-column:1/-1;
}

label{
  margin-bottom:10px;
  font-size:14px;
  font-weight:600;
  color:#374151;
}

input,
select{
  height:56px;
  border:1px solid #d1d5db;
  border-radius:16px;
  padding:0 18px;
  font-size:16px;
  transition:0.2s;
  background:white;
}

input:focus,
select:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,0.12);
}

.locked{
  background:#f3f4f6;
  color:#6b7280;
  font-weight:700;
}

/* CHECKBOX */

.checkbox-area{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:8px;
}

.checkbox-area input{
  width:20px;
  height:20px;
  accent-color:#2563eb;
}

.checkbox-area label{
  margin:0;
  font-size:15px;
  font-weight:600;
}

/* BUTTON */

button{
  width:100%;
  height:60px;
  border:none;
  border-radius:18px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:700;
  margin-top:35px;
  cursor:pointer;
  transition:0.25s;
}

button:hover{
  background:#1d4ed8;
  transform:translateY(-2px);
}

/* RESULTS */

.results{
  margin-top:35px;
  background:#f8fafc;
  border-radius:24px;
  padding:30px;
  border:1px solid #e5e7eb;
}

.results h2{
  margin-bottom:24px;
  font-size:26px;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:24px;
}

.card span{
  display:block;
  color:#6b7280;
  font-size:14px;
  margin-bottom:12px;
}

.card h3{
  font-size:28px;
  color:#111827;
}

.final{
  background:#2563eb;
  color:white;
  border:none;
}

.final span{
  color:rgba(255,255,255,0.8);
}

.final h3{
  color:white;
}

/* MOBILE */

@media(max-width:768px){

  body{
    padding:12px;
  }

  .header{
    padding:28px 22px;
  }

  .header h1{
    font-size:28px;
  }

  .content{
    padding:22px;
  }

  .grid,
  .result-grid{
    grid-template-columns:1fr;
  }

  input,
  select{
    font-size:15px;
  }

  .card h3{
    font-size:24px;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Material Cost Calculator</h1>

    <p>
      Smart and modern calculator for quantity, material pricing,
      adhesive cost, color charge, and final per-piece calculation.
    </p>
  </div>

  <div class="content">

    <div class="grid">

      <div class="input-box full">
        <label>Measurement Unit</label>

        <select id="unit">
          <option value="inch">Inch</option>
          <option value="cm">CM</option>
          <option value="meter">Meter</option>
        </select>
      </div>

      <div class="input-box">
        <label>Locked Value</label>

        <input
          type="number"
          value="75000"
          class="locked"
          readonly
        >
      </div>

      <div class="input-box">
        <label>Thickness (MM)</label>

        <input
          type="number"
          id="thickness"
          placeholder="Enter thickness"
        >
      </div>

      <div class="input-box">
        <label>Height</label>

        <input
          type="number"
          id="height"
          placeholder="Enter height"
        >
      </div>

      <div class="input-box">
        <label>Weight</label>

        <input
          type="number"
          id="weight"
          placeholder="Enter weight"
        >
      </div>

      <div class="input-box">
        <label>Pound Price</label>

        <input
          type="number"
          id="poundPrice"
          placeholder="Enter pound price"
        >
      </div>

      <div class="input-box">
        <label>Number of Colors</label>

        <input
          type="number"
          id="colors"
          placeholder="Enter total colors"
        >
      </div>

      <!-- Adhesive Tick Option -->

      <div class="input-box full">

        <div class="checkbox-area">

          <input
            type="checkbox"
            id="adhesiveCheck"
          >

          <label for="adhesiveCheck">
            Add Adhesive Cost
          </label>

        </div>

      </div>

    </div>

    <button onclick="calculatePrice()">
      Calculate Final Price
    </button>

    <!-- RESULTS -->

    <div class="results">

      <h2>Calculation Result</h2>

      <div class="result-grid">

        <div class="card">
          <span>Quantity</span>
          <h3 id="quantity">0 PC</h3>
        </div>

        <div class="card">
          <span>Per PC Material Price</span>
          <h3 id="materialPrice">0 Tk</h3>
        </div>

        <div class="card">
          <span>Color Cost</span>
          <h3 id="colorCost">0 Tk</h3>
        </div>

        <div class="card">
          <span>Adhesive Cost</span>
          <h3 id="adhesiveCost">0 Tk</h3>
        </div>

        <div class="card final full">
          <span>Final Per PC Price</span>
          <h3 id="finalPrice">0 Tk</h3>
        </div>

      </div>

    </div>

  </div>

</div>

<script>

/* CONVERT TO INCH */

function convertToInch(value, unit){

  if(unit === "cm"){
    return value / 2.54;
  }

  if(unit === "meter"){
    return value * 39.3701;
  }

  return value;
}

/* MAIN CALCULATION */

function calculatePrice(){

  const unit =
    document.getElementById("unit").value;

  let height =
    parseFloat(document.getElementById("height").value) || 0;

  let weight =
    parseFloat(document.getElementById("weight").value) || 0;

  let thickness =
    parseFloat(document.getElementById("thickness").value) || 0;

  let poundPrice =
    parseFloat(document.getElementById("poundPrice").value) || 0;

  let colors =
    parseFloat(document.getElementById("colors").value) || 0;

  let adhesiveEnabled =
    document.getElementById("adhesiveCheck").checked;

  /* AUTO CONVERT */

  height = convertToInch(height, unit);
  weight = convertToInch(weight, unit);

  /* QUANTITY FORMULA */

  const quantity =
    75000 / height / weight / thickness;

  /* MATERIAL PRICE */

  const materialPrice =
    poundPrice / quantity;

  /* COLOR COST */

  const colorCost =
    colors * 0.15;

  /* ADHESIVE COST */

  let adhesiveCost = 0;

  if(adhesiveEnabled){
    adhesiveCost = weight * 0.2;
  }

  /* FINAL PRICE */

  const finalPrice =
    materialPrice +
    colorCost +
    adhesiveCost;

  /* SHOW RESULTS */

  document.getElementById("quantity").innerHTML =
    quantity.toFixed(2) + " PC";

  document.getElementById("materialPrice").innerHTML =
    materialPrice.toFixed(4) + " Tk";

  document.getElementById("colorCost").innerHTML =
    colorCost.toFixed(4) + " Tk";

  document.getElementById("adhesiveCost").innerHTML =
    adhesiveCost.toFixed(4) + " Tk";

  document.getElementById("finalPrice").innerHTML =
    finalPrice.toFixed(4) + " Tk";

}

</script>

</body>
</html>
