<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

<title>Material Cost Calculator</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family: Inter, Arial, sans-serif;
  background:#eef2f7;
  min-height:100vh;
  color:#111827;
  padding:12px;
}

/* APP */

.app{
  width:100%;
  max-width:500px;
  margin:auto;
  background:#ffffff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:
  0 8px 25px rgba(0,0,0,0.08);
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  padding:28px 22px;
  color:white;
}

.header h1{
  font-size:26px;
  line-height:1.3;
  margin-bottom:10px;
}

.header p{
  font-size:14px;
  opacity:0.85;
  line-height:1.6;
}

/* CONTENT */

.content{
  padding:20px;
}

.input-box{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:9px;
  font-size:14px;
  font-weight:600;
  color:#374151;
}

input,
select{
  width:100%;
  height:56px;
  border:1px solid #d1d5db;
  border-radius:16px;
  padding:0 16px;
  font-size:16px;
  background:white;
  transition:0.2s;
}

input:focus,
select:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,0.12);
}

.locked{
  background:#f3f4f6;
  color:#6b7280;
  font-weight:700;
}

/* CHECKBOX */

.checkbox-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  padding:16px;
  border-radius:16px;
  margin-top:6px;
}

.checkbox-wrap input{
  width:22px;
  height:22px;
  accent-color:#2563eb;
}

.checkbox-wrap label{
  margin:0;
  font-size:15px;
}

/* BUTTON */

button{
  width:100%;
  height:58px;
  border:none;
  border-radius:18px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:700;
  margin-top:10px;
  cursor:pointer;
  transition:0.2s;
}

button:active{
  transform:scale(0.98);
}

/* RESULTS */

.results{
  margin-top:24px;
}

.results h2{
  font-size:22px;
  margin-bottom:16px;
}

.card{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

.card span{
  display:block;
  font-size:13px;
  color:#6b7280;
  margin-bottom:8px;
}

.card h3{
  font-size:24px;
  color:#111827;
  word-break:break-word;
}

.final{
  background:#2563eb;
  border:none;
}

.final span{
  color:rgba(255,255,255,0.8);
}

.final h3{
  color:white;
}

/* DESKTOP */

@media(min-width:768px){

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
  }

  .app{
    max-width:950px;
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .header{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:40px;
  }

  .header h1{
    font-size:38px;
  }

  .header p{
    font-size:16px;
  }

  .content{
    padding:35px;
    overflow:auto;
  }

  .results{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .results h2{
    grid-column:1/-1;
  }

  .card{
    margin:0;
  }

  .final{
    grid-column:1/-1;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- LEFT SIDE -->

  <div class="header">

    <h1>
      Material Cost Calculator
    </h1>

    <p>
      Mobile optimized smart calculator for quantity,
      material cost, adhesive charge,
      color pricing and final per-piece cost.
    </p>

  </div>

  <!-- RIGHT SIDE -->

  <div class="content">

    <div class="input-box">

      <label>Measurement Unit</label>

      <select id="unit">
        <option value="inch">Inch</option>
        <option value="cm">CM</option>
        <option value="meter">Meter</option>
      </select>

    </div>

    <div class="input-box">

      <label>Locked Value</label>

      <input
        type="number"
        value="75000"
        readonly
        class="locked"
      >

    </div>

    <div class="input-box">

      <label>Thickness (MM)</label>

      <input
        type="number"
        id="thickness"
        placeholder="Enter thickness"
      >

    </div>

    <div class="input-box">

      <label>Height</label>

      <input
        type="number"
        id="height"
        placeholder="Enter height"
      >

    </div>

    <div class="input-box">

      <label>Weight</label>

      <input
        type="number"
        id="weight"
        placeholder="Enter weight"
      >

    </div>

    <div class="input-box">

      <label>Pound Price</label>

      <input
        type="number"
        id="poundPrice"
        placeholder="Enter pound price"
      >

    </div>

    <div class="input-box">

      <label>Number of Colors</label>

      <input
        type="number"
        id="colors"
        placeholder="Enter colors"
      >

    </div>

    <!-- ADHESIVE OPTION -->

    <div class="checkbox-wrap">

      <input
        type="checkbox"
        id="adhesiveCheck"
      >

      <label for="adhesiveCheck">
        Add Adhesive Cost
      </label>

    </div>

    <button onclick="calculatePrice()">
      Calculate Final Price
    </button>

    <!-- RESULTS -->

    <div class="results">

      <h2>Results</h2>

      <div class="card">

        <span>Quantity</span>

        <h3 id="quantity">
          0 PC
        </h3>

      </div>

      <div class="card">

        <span>Per PC Material Price</span>

        <h3 id="materialPrice">
          0 Tk
        </h3>

      </div>

      <div class="card">

        <span>Color Cost</span>

        <h3 id="colorCost">
          0 Tk
        </h3>

      </div>

      <div class="card">

        <span>Adhesive Cost</span>

        <h3 id="adhesiveCost">
          0 Tk
        </h3>

      </div>

      <div class="card final">

        <span>Final Per PC Price</span>

        <h3 id="finalPrice">
          0 Tk
        </h3>

      </div>

    </div>

  </div>

</div>

<script>

function convertToInch(value, unit){

  if(unit === "cm"){
    return value / 2.54;
  }

  if(unit === "meter"){
    return value * 39.3701;
  }

  return value;
}

function calculatePrice(){

  const unit =
    document.getElementById("unit").value;

  let height =
    parseFloat(document.getElementById("height").value) || 0;

  let weight =
    parseFloat(document.getElementById("weight").value) || 0;

  let thickness =
    parseFloat(document.getElementById("thickness").value) || 0;

  let poundPrice =
    parseFloat(document.getElementById("poundPrice").value) || 0;

  let colors =
    parseFloat(document.getElementById("colors").value) || 0;

  const adhesiveEnabled =
    document.getElementById("adhesiveCheck").checked;

  /* AUTO CONVERT */

  height = convertToInch(height, unit);
  weight = convertToInch(weight, unit);

  /* QUANTITY */

  const quantity =
    75000 / height / weight / thickness;

  /* MATERIAL PRICE */

  const materialPrice =
    poundPrice / quantity;

  /* COLOR COST */

  const colorCost =
    colors * 0.15;

  /* ADHESIVE */

  let adhesiveCost = 0;

  if(adhesiveEnabled){
    adhesiveCost = weight * 0.2;
  }

  /* FINAL */

  const finalPrice =
    materialPrice +
    colorCost +
    adhesiveCost;

  /* OUTPUT */

  document.getElementById("quantity").innerHTML =
    quantity.toFixed(2) + " PC";

  document.getElementById("materialPrice").innerHTML =
    materialPrice.toFixed(4) + " Tk";

  document.getElementById("colorCost").innerHTML =
    colorCost.toFixed(4) + " Tk";

  document.getElementById("adhesiveCost").innerHTML =
    adhesiveCost.toFixed(4) + " Tk";

  document.getElementById("finalPrice").innerHTML =
    finalPrice.toFixed(4) + " Tk";

}

</script>

</body>
</html>
